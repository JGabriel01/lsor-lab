server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name jglh.local www.jglh.local;

    root /var/www/jglh;
    index index.html;

    access_log /var/log/nginx/jglh_access.log;
    error_log  /var/log/nginx/jglh_error.log;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /api/status {
        default_type application/json;
        return 200 '{"status":"ok","service":"nginx","dupla":["Jose Gabriel","Luiz Henrique"]}\n';
    }

    error_page 404 /404.html;
    location = /404.html {
        root /var/www/jglh;
        internal;
    }
}
