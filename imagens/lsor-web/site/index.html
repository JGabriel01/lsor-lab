<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Corporativo - José Gabriel e Luiz Henrique</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #fff;
            padding: 2rem 2.5rem;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            max-width: 540px;
            text-align: center;
        }
        h1 { color: #1a56db; margin-top: 0; }
        .dupla {
            background: #eff6ff;
            border-left: 4px solid #1a56db;
            padding: 0.75rem 1rem;
            margin: 1.25rem 0;
            text-align: left;
        }
        code { background: #eee; padding: 2px 6px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Servidor Web NGINX (DMZ)</h1>
        <p>Serviço HTTP publicado com segurança via roteador/firewall Kathará.</p>
        <div class="dupla">
            <strong>Integrantes da dupla:</strong>
            <ul>
                <li>José Gabriel</li>
                <li>Luiz Henrique</li>
            </ul>
        </div>
        <p>Endpoint de status: <a href="/api/status"><code>/api/status</code></a></p>
    </div>
</body>
</html>
